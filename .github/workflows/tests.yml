name: tests
on:
  push:
  pull_request:
jobs:
  fast:
    # standard-library tests only: no audio models, no Live (run_tests.py --fast)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run_tests.py --fast
